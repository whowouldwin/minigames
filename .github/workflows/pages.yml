name: Verify and deploy Story 3

on:
  push:
    branches: [story-3]
  pull_request:
    branches: [story-1, story-2, story-3, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier . --check
      - run: npm run build -- --base=/minigames/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/story-3'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
